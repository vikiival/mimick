type CollectionEntity @entity {
  blockNumber: BigInt
  createdAt: DateTime!
  currentOwner: String!
  distribution: Int! # dummy
  events: [CollectionEvent!] @derivedFrom(field: "collection")
  floor: BigInt! # dummy
  hash: String! @unique
  highestSale: BigInt! # dummy
  id: ID!
  image: String
  issuer: String!
  max: Int
  media: String
  meta: MetadataEntity
  metadata: String
  name: String @index
  nftCount: Int! # dummy
  nfts: [NFTEntity!] @derivedFrom(field: "collection")
  ownerCount: Int! # dummy
  supply: Int! # dummy
  baseUri: String
  symbol: String # dummy
  type: CollectionType!
  updatedAt: DateTime!
  version: Int! # dummy
  volume: BigInt! # dummy
}

type NFTEntity @entity {
  blockNumber: BigInt
  burned: Boolean!
  collection: CollectionEntity!
  createdAt: DateTime!
  currentOwner: String! @index
  events: [Event!] @derivedFrom(field: "nft")
  hash: String! @index
  id: ID!
  image: String
  issuer: String!
  # lewd: Boolean!
  media: String
  meta: MetadataEntity
  metadata: String
  name: String @index
  price: BigInt
  recipient: String
  royalty: Float
  sn: String!
  updatedAt: DateTime!
  version: Int!
  # token: TokenEntity!
}

type MetadataEntity @entity {
  id: ID!
  name: String
  description: String
  image: String
  attributes: [Attribute!]
  animationUrl: String
  type: String
}

type Attribute @jsonField {
  display: String
  trait: String
  value: String!
}

interface EventType {
  id: ID!
  blockNumber: BigInt
  timestamp: DateTime!
  caller: String!
  currentOwner: String
  interaction: Interaction!
  meta: String!
}

type Event implements EventType @entity {
  id: ID!
  blockNumber: BigInt
  timestamp: DateTime!
  caller: String!
  currentOwner: String! # currentOwner
  interaction: Interaction!
  meta: String!
  nft: NFTEntity!
}

type CollectionEvent implements EventType @entity {
  id: ID!
  blockNumber: BigInt
  timestamp: DateTime!
  caller: String!
  currentOwner: String # currentOwner
  interaction: Interaction!
  meta: String!
  collection: CollectionEntity!
}

enum CollectionType {
  ERC721
  ERC1155
}

enum Interaction {
  BURN
  BUY
  CREATE
  LIST
  MINT
  SEND
  UNLIST
}